[pytest]
testpaths = tests
asyncio_mode = auto
; Os engines async da app (app/database/session.py::engine/engine_sistema)
; são criados UMA VEZ, à importação — ficam presos ao event loop que
; existir nesse momento. Com o âmbito default (por teste), cada teste
; ganha um loop novo e os pedidos seguintes falham a meio (visível no
; Windows como "AttributeError: 'NoneType' object has no attribute
; 'send'" dentro do asyncpg/ProactorEventLoop). Loop único para a
; sessão inteira resolve, porque corresponde ao tempo de vida real dos
; engines.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
