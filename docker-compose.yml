# Ambiente completo local via `docker compose up --build` — Postgres
# com RLS a sério (mesmos roles/policies de produção), Redis
# (coordenação entre instâncias — aqui só há uma de cada, mas a app já
# fica pronta para mais), SeaweedFS (storage S3-compatível para logótipo/
# anexos, ver app/core/storage.py), back-end, front-end (Angular SSR)
# e um nginx como ponto de entrada único em http://localhost.
#
# NÃO é uma receita de produção tal e qual (passwords fixas abaixo,
# sem TLS, um Postgres só sem réplica) — é o ambiente local mais
# próximo possível da topologia real, para deixar de depender de
# arrancar back-end e front-end à mão em dois terminais separados.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_apenas
      POSTGRES_DB: academic_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/docker-init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Storage S3-compatível para o logótipo da escola e anexos de
  # Comunicados (ver app/core/storage.py) — em produção real, isto
  # seria antes um bucket AWS S3/equivalente gerido; aqui é o mais
  # próximo que dá para correr localmente sem depender de uma conta
  # cloud só para testar o fluxo. SeaweedFS (era MinIO, cujas imagens
  # deixaram de estar disponíveis publicamente), publicado na porta 9000
  # de antes: um back-end corrido fora do Docker com
  # S3_ENDPOINT_URL=http://localhost:9000 continua a funcionar. Mesmas
  # credenciais de desenvolvimento (deploy/s3-desenvolvimento.json).
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-ip.bind=0.0.0.0", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - s3_data:/data
      - ./deploy/s3-desenvolvimento.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "9000:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria o bucket no arranque — este serviço corre, termina, e fica
  # "Exited (0)"; não é um bug, é o esperado (não é um servidor). Se o
  # bucket já existir, o erro do "create" é ignorado.
  s3-setup:
    image: chrislusf/seaweedfs:latest
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "sleep 5; echo 's3.bucket.create -name gestao-academica' | weed shell -master=s3:9333 -filer=s3:8888; true"]

  backend:
    build: ./back_end
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://app_tenant:app_tenant_docker@postgres:5432/academic_db
      DATABASE_URL_SISTEMA: postgresql+asyncpg://app_sistema:app_sistema_docker@postgres:5432/academic_db
      DATABASE_URL_MIGRACOES: postgresql+asyncpg://postgres:postgres_dev_apenas@postgres:5432/academic_db
      # Sem valor fixo de propósito: o back-end recusa arrancar com uma chave
      # que já esteve no git (ver app/core/security.py::validar_chave_jwt).
      # Definir num .env ao lado deste ficheiro, gerada com:
      #   python -c "import secrets; print(secrets.token_urlsafe(64))"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY num .env ao lado do docker-compose.yml}
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: gestao-academica
      S3_ENDPOINT_URL: http://s3:8333
      S3_ACCESS_KEY: minio_admin
      S3_SECRET_KEY: minio_dev_apenas
      CORS_ALLOWED_ORIGINS: http://localhost
      FRONTEND_URL: http://localhost
      # Os pedidos chegam todos via nginx (outro container) — sem isto o
      # uvicorn só confia em 127.0.0.1, ignora o X-Forwarded-For, e toda a
      # gente parece ter o IP do nginx: os limites de tentativas (login,
      # registo, chat) ficam globais em vez de por visitante. Gama das
      # redes internas do Docker; nunca "*" (deixaria qualquer cliente
      # falsificar o próprio IP no cabeçalho).
      FORWARDED_ALLOW_IPS: "172.16.0.0/12"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build: ./gacademic
    depends_on:
      - backend
    environment:
      # "localhost" cobre os pedidos que chegam via nginx (Host:
      # localhost, quando acedido em http://localhost); "localhost:4000"
      # (já vem por omissão do Dockerfile) cobre o healthcheck do
      # próprio container, que fala diretamente com localhost:4000 sem
      # passar pelo nginx.
      NG_ALLOWED_HOSTS: localhost:4000,localhost
    ports:
      - "4000:4000"

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"

volumes:
  postgres_data:
  s3_data:
