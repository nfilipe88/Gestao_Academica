<div class="min-h-screen flex items-center justify-center bg-slate-950 p-4">
  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">

    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white">Registe a sua Instituição</h1>
      <p class="text-slate-400 text-sm mt-1">Crie o ambiente digital e a conta de administrador local</p>
    </div>

    <form [formGroup]="registoForm" (ngSubmit)="onRegister()" class="space-y-4">

      <div class="border-b border-slate-800 pb-4 mb-4">
        <h3 class="text-sm font-semibold text-blue-400 uppercase tracking-wider mb-3">Dados da Escola</h3>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Nome da Escola</label>
            <input type="text" formControlName="nome_fantasia"
              class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-white text-sm focus:outline-hidden focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">NIF / Número de Identificação</label>
            <input type="text" formControlName="cnpj_nif"
              class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-white text-sm focus:outline-hidden focus:border-blue-500" />
          </div>
        </div>
      </div>

      <div>
        <h3 class="text-sm font-semibold text-blue-400 uppercase tracking-wider mb-3">Conta do Diretor / Gestor</h3>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Nome Completo</label>
            <input type="text" formControlName="nome_gestor"
              class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-white text-sm focus:outline-hidden focus:border-blue-500" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">E-mail Administrativo</label>
            <input type="email" formControlName="email_gestor"
              class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-white text-sm focus:outline-hidden focus:border-blue-500" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Defina a Palavra-passe</label>
            <input type="password" formControlName="palavra_passe"
              class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-white text-sm focus:outline-hidden focus:border-blue-500" />
          </div>
        </div>
      </div>

      <button type="submit" [disabled]="registoForm.invalid"
        class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-semibold rounded-md py-2.5 mt-2 transition-colors cursor-pointer">
        Concluir Registo e Criar Tenant
      </button>
    </form>

  </div>
</div>
