<div class="space-y-6">

  <div>
    <h2 class="text-2xl font-bold text-slate-800">Estatísticas</h2>
    <p class="text-slate-500 text-sm">As mesmas estatísticas do Gestor — dashboard, relatório por período e exports .xlsx/.xls — de qualquer escola da plataforma. Escolha a instituição para começar.</p>
  </div>

  <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200">
    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Escola</label>
    <select
      class="w-full sm:w-96 border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700"
      [ngModel]="tenantIdSelecionado"
      (ngModelChange)="onEscolherEscola($event)">
      <option [ngValue]="null">Selecione uma escola…</option>
      @for (tenant of tenants$ | async; track tenant.id) {
        <option [ngValue]="tenant.id">{{ tenant.nome_fantasia }}</option>
      }
    </select>
  </div>

  @if (tenantIdSelecionado) {
    <!-- O seletor de EstatisticasComponent é 'app-estatisticas.component'
         — em CSS/Angular isso é o elemento "app-estatisticas" com a
         classe "component", daí a class= abaixo em vez de fazer parte
         do nome da tag. -->
    <app-estatisticas class="component" [tenantId]="tenantIdSelecionado" />
  } @else {
    <div class="bg-white p-8 rounded-xl shadow-xs border border-slate-200 border-dashed text-center text-sm text-slate-400">
      Escolha uma escola acima para ver as estatísticas dela.
    </div>
  }

</div>
