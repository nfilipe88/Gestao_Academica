<div class="space-y-6">

  <div>
    <h2 class="text-2xl font-bold text-slate-800">Gestão de Cursos</h2>
    <p class="text-slate-500 text-sm">Adicione e gira as estruturas curriculares da sua instituição.</p>
  </div>

  <div class="bg-white p-6 rounded-xl shadow-xs border border-slate-200">
    <h3 class="text-lg font-semibold text-slate-800 mb-4">Novo Curso</h3>
    <form [formGroup]="cursoForm" (ngSubmit)="onSubmit()" class="flex gap-4 items-end">
      <div class="flex-1">
        <label class="block text-sm font-medium text-slate-600 mb-1">Nome do Curso</label>
        <input type="text" formControlName="nome"
          class="w-full border border-slate-300 rounded-lg px-4 py-2 text-slate-800 focus:outline-hidden focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          placeholder="Ex: Ensino Secundário - Ciências e Tecnologias" />
      </div>
      <button type="submit" [disabled]="cursoForm.invalid"
        class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg disabled:opacity-50 transition-colors">
        Adicionar Curso
      </button>
    </form>
  </div>

  <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
          <th class="py-3 px-6 font-medium">Nome do Curso</th>
          <th class="py-3 px-6 font-medium text-right">Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (curso of cursos$ | async; track curso.id) {
        <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
          <td class="py-3 px-6 text-slate-800 font-medium">{{ curso.nome }}</td>
          <td class="py-3 px-6 text-right">
            <button class="text-blue-500 hover:text-blue-700 text-sm font-medium">Ver Turmas</button>
          </td>
        </tr>
        } @empty {
        <tr>
          <td colspan="2" class="py-8 text-center text-slate-500">
            Nenhum curso registado na sua instituição.
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>

</div>
