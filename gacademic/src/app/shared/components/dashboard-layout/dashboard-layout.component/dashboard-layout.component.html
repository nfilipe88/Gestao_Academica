<div class="flex h-screen bg-slate-100">

      <aside class="w-64 bg-slate-900 text-white flex flex-col transition-all">
        <div class="p-6">
          <h1 class="text-2xl font-bold text-blue-500">SaaS Académico</h1>
        </div>

        <nav class="flex-1 px-4 space-y-2 mt-4">
          <a routerLink="/dashboard" class="block py-2.5 px-4 rounded-lg hover:bg-slate-800 transition-colors">Visão Geral</a>
          <a routerLink="/cursos" class="block py-2.5 px-4 rounded-lg hover:bg-slate-800 transition-colors">Cursos</a>
          <a routerLink="/turmas" class="block py-2.5 px-4 rounded-lg hover:bg-slate-800 transition-colors">Turmas e Alunos</a>

          <!-- "Administração" removido daqui até existir a rota /admin/configuracoes.
               Um link para uma rota inexistente cai no wildcard e devolve
               silenciosamente ao dashboard, o que parecia um botão avariado. -->
        </nav>

        <div class="p-4 border-t border-slate-800">
          <button (click)="onLogout()" class="w-full text-left text-rose-400 hover:text-rose-300 py-2 px-4 rounded-lg hover:bg-slate-800 transition-colors">
            Sair do Sistema
          </button>
        </div>
      </aside>

      <main class="flex-1 overflow-y-auto p-8">
        <router-outlet></router-outlet>
      </main>

    </div>
