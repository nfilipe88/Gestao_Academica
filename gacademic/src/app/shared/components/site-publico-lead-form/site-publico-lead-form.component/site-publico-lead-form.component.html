@if (erro) {
  <div class="erro">{{ erro }}</div>
}

<form [formGroup]="form" (ngSubmit)="enviar.emit()" class="grupo">
  <div class="campo">
    <label for="f-site-publico-lead-form-1">O seu nome</label>
    <input type="text" formControlName="nome_responsavel" id="f-site-publico-lead-form-1" />
  </div>
  <div class="campo">
    <label for="f-site-publico-lead-form-2">Nome do candidato (aluno)</label>
    <input type="text" formControlName="nome_aluno_candidato" id="f-site-publico-lead-form-2" />
  </div>
  <div class="duplo">
    <div class="campo">
      <label for="f-site-publico-lead-form-3">E-mail — opcional</label>
      <input type="email" formControlName="email_contato" id="f-site-publico-lead-form-3" />
    </div>
    <div class="campo">
      <label for="f-site-publico-lead-form-4">Telefone — opcional</label>
      <input type="text" formControlName="telefone" id="f-site-publico-lead-form-4" />
    </div>
  </div>
  <div class="campo">
    <label for="f-site-publico-lead-form-5">Mensagem — opcional</label>
    <textarea formControlName="mensagem" rows="3" id="f-site-publico-lead-form-5"></textarea>
  </div>
  <p class="aviso-privacidade">
    Os dados que indicar são usados pela escola só para responder a este pedido. Se não avançar para
    matrícula, são apagados ao fim de 15 dias sem atividade.
    <a href="/privacidade" target="_blank" rel="noopener">Política de Privacidade</a>.
  </p>
  <button type="submit" [disabled]="form.invalid">Enviar Pedido de Contacto</button>
</form>
