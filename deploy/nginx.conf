# Ponto de entrada único do docker-compose: front-end e back-end ficam
# na mesma origem (http://localhost) do ponto de vista do browser — a
# app Angular chama a API com caminhos relativos ("/api/v1/..."), por
# isso isto resolve sozinho o CORS neste caminho (mesma origem = sem
# CORS nenhum a negociar) e é o mesmo desenho que uma instalação real
# atrás de um domínio único costuma usar.
#
# Cabeçalhos de segurança (defesa em profundidade contra XSS — o refresh token
# já vive num cookie HttpOnly, ver back_end/app/api/v1/auth.py):
#  - Content-Security-Policy: só scripts da própria origem + reCAPTCHA da Google
#    (ver core/services/recaptcha.service.ts). Sem 'unsafe-inline' nem
#    'unsafe-eval' em scripts. Os estilos precisam de 'unsafe-inline' (Angular
#    e Tailwind aplicam estilos em linha).
#  - Se os ficheiros forem servidos por um bucket S3/CDN noutro domínio (fotos,
#    logótipos, documentos), acrescentar esse domínio a img-src/frame-src.
#  - Strict-Transport-Security só faz sentido atrás de HTTPS: ativar no
#    servidor de produção (TLS) — está comentado aqui porque este ficheiro
#    serve HTTP simples em desenvolvimento. O back-end já o envia sozinho em
#    todas as respostas da API que chegam por HTTPS (X-Forwarded-Proto), ver
#    back_end/app/core/cabecalhos.py.
#
# Permissions-Policy: câmara/microfone só para a própria origem — os exames
# remotos com câmara/microfone obrigatórios (Portal, ver portal.component.ts)
# precisam de getUserMedia; "camera=()" bloqueava-os para toda a gente.
#
# X-Forwarded-For: o nginx é a borda — substitui (não acrescenta) o valor
# enviado pelo cliente pelo IP real da ligação, para ninguém conseguir
# falsificar o próprio IP e contornar os limites de tentativas do back-end
# (ver FORWARDED_ALLOW_IPS em docker-compose.yml). Se um dia houver outro
# proxy/CDN à frente deste nginx, trocar por real_ip_header + set_real_ip_from.
events {}

http {
    server {
        listen 80;

        # Maior upload aceite pelo back-end: 8 MB (documentos da candidatura,
        # ver cruds/crm.py) + margem do multipart. Sem isto o nginx usa 1 MB
        # por omissão e recusa (413) fotos, assinaturas, documentos e a
        # importação de pautas acima disso.
        client_max_body_size 10m;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://www.google.com/recaptcha/; frame-src 'self' blob: https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
