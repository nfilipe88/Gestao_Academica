# Ponto de entrada único do docker-compose: front-end e back-end ficam
# na mesma origem (http://localhost) do ponto de vista do browser — a
# app Angular chama a API com caminhos relativos ("/api/v1/..."), por
# isso isto resolve sozinho o CORS neste caminho (mesma origem = sem
# CORS nenhum a negociar) e é o mesmo desenho que uma instalação real
# atrás de um domínio único costuma usar.
events {}

http {
    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
