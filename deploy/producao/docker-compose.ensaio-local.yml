# Ensaio LOCAL da receita de produção (nunca usar no servidor real):
# acrescenta um SeaweedFS a fazer de "S3 externo", com dois buckets e um
# utilizador só de escrita para os backups (ensaio-local/s3.json) — o
# mesmo desenho que se pede ao fornecedor S3 real. Ver LEIA-ME.md, secção
# "Ensaio local". (Era MinIO; as imagens do MinIO deixaram de estar
# disponíveis publicamente.)
#
#   docker compose -f docker-compose.yml -f docker-compose.ensaio-local.yml up -d --build

services:
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-ip.bind=0.0.0.0", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - ./ensaio-local/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  s3-setup:
    image: chrislusf/seaweedfs:latest
    depends_on:
      s3:
        condition: service_healthy
    networks: [interna]
    entrypoint: ["/bin/sh", "-c", "sleep 5; printf 's3.bucket.create -name ficheiros\\ns3.bucket.create -name backups\\n' | weed shell -master=s3:9333 -filer=s3:8888; true"]

  backend:
    depends_on:
      s3-setup:
        condition: service_completed_successfully
