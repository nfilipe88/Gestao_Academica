# Comum às duas formas de produção (nginx.conf.template, com certificado no
# servidor, e nginx.cloudflare.conf.template, atrás do Túnel da Cloudflare).
# Quem inclui isto define $proto_visitante: como o visitante chegou até nós.

client_max_body_size 10m;

# HSTS: durante 1 ano o browser recusa HTTP simples para este domínio.
# Sem includeSubDomains: outros subdomínios podem ainda não ter HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://www.google.com/recaptcha/ https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src 'self' blob: https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

# Endereços de ferramentas de varrimento (ficheiros de configuração,
# painéis de outros sistemas): vão para o back-end, que os regista
# como evento de segurança com o IP real e responde 404 — sem isto
# iam para o front-end e ninguém sabia. Ver app/core/eventos_seguranca.py.
location ~* (/\.env|/\.git|/\.svn|/\.aws|/\.ssh|/\.htaccess|wp-admin|wp-login|wp-content|xmlrpc\.php|phpmyadmin|\.php$|\.aspx?$|\.jsp$|cgi-bin|/actuator|/server-status|/vendor/phpunit|/boaform|/HNAP1|/manager/html) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $proto_visitante;
}

location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Substitui (não acrescenta) o que o cliente mandou — ver deploy/nginx.conf.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $proto_visitante;
    proxy_read_timeout 120s;
    # O back-end também envia HSTS em HTTPS (app/core/cabecalhos.py);
    # aqui fica só o do nginx, sem cabeçalho duplicado.
    proxy_hide_header Strict-Transport-Security;
}

location / {
    proxy_pass http://frontend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $proto_visitante;
}
